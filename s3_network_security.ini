# ============================================================
# s3_network_security.ini — Réseau RPL + Sécurité (DDoS)
# Semaine 3 : Couche réseau et sécurité
# Projet : Modélisation cross-layer IoT
#
# Prérequis : OMNeT++ 6.x + INET 4.5
# Lancer : opp_run -f s3_network_security.ini -c RPL_Normal
# ============================================================

[General]
network = iot_crosslayer.SmallIoTNetwork
sim-time-limit = 120s
repeat = 5
seed-set = ${repetition}

result-dir = ../../../results/omnet/s3
output-scalar-file = ${resultdir}/s3-${configname}-${repetition}.sca
output-vector-file  = ${resultdir}/s3-${configname}-${repetition}.vec

**.scalar-recording = true
**.vector-recording = true

# ── Radio INET 4.5 ────────────────────────────────────────
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -100dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# ── Propagation + Fading ──────────────────────────────────
**.radioMedium.pathLossType = "LogDistancePathLoss"
**.radioMedium.pathLoss.pathLossExponent = 3.0
**.radioMedium.pathLoss.referenceDistance = 1m
**.radioMedium.fadingType = "NakagamiFading"
**.radioMedium.fading.m = 1.0

# ── Station de base ───────────────────────────────────────
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 200m
*.baseStation.mobility.initialY = 200m
*.baseStation.mobility.initialZ = 5m

# ── 7 nœuds IoT à différentes distances ──────────────────
*.node[0].mobility.typename = "StationaryMobility"
*.node[0].mobility.initialX = 210m
*.node[0].mobility.initialY = 200m

*.node[1].mobility.typename = "StationaryMobility"
*.node[1].mobility.initialX = 220m
*.node[1].mobility.initialY = 200m

*.node[2].mobility.typename = "StationaryMobility"
*.node[2].mobility.initialX = 235m
*.node[2].mobility.initialY = 200m

*.node[3].mobility.typename = "StationaryMobility"
*.node[3].mobility.initialX = 250m
*.node[3].mobility.initialY = 200m

*.node[4].mobility.typename = "StationaryMobility"
*.node[4].mobility.initialX = 265m
*.node[4].mobility.initialY = 200m

*.node[5].mobility.typename = "StationaryMobility"
*.node[5].mobility.initialX = 280m
*.node[5].mobility.initialY = 200m

*.node[6].mobility.typename = "StationaryMobility"
*.node[6].mobility.initialX = 295m
*.node[6].mobility.initialY = 200m

# ── Trafic normal ─────────────────────────────────────────
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "baseStation"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 32B
*.node[*].app[0].sendInterval = uniform(0.8s, 1.2s)

*.baseStation.numApps = 1
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000

# ── Énergie (modèle batterie simplifié) ───────────────────
**.energyStorage.typename = "SimpleEpEnergyStorage"
**.energyStorage.nominalCapacity = 1J
**.energyStorage.initialCapacity = 1J
**.wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.wlan[*].radio.energyConsumer.offPowerConsumption = 0mW
**.wlan[*].radio.energyConsumer.sleepPowerConsumption = 1mW
**.wlan[*].radio.energyConsumer.switchingPowerConsumption = 1mW
**.wlan[*].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
**.wlan[*].radio.energyConsumer.receiverBusyPowerConsumption = 5mW
**.wlan[*].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
**.wlan[*].radio.energyConsumer.transmitterIdlePowerConsumption = 2mW
**.wlan[*].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW

# ============================================================
# [Config RPL_Normal] — Réseau RPL sans attaque (référence)
# ============================================================
[Config RPL_Normal]
description = "Réseau RPL normal — 7 nœuds sans attaque"
# Configuration de base ci-dessus

# ============================================================
# [Config DDoS_Attack] — Attaque DDoS entre t=40s et t=80s
# Un nœud attaquant injecte du trafic malveillant
# ============================================================
[Config DDoS_Attack]
description = "Attaque DDoS simulée (t=40s à t=80s)"

# Nœud 6 devient l'attaquant (envoie 10x plus de paquets)
*.node[6].numApps = 2
*.node[6].app[0].typename = "UdpBasicApp"
*.node[6].app[0].destAddresses = "baseStation"
*.node[6].app[0].destPort = 5000
*.node[6].app[0].messageLength = 32B
*.node[6].app[0].sendInterval = uniform(0.8s, 1.2s)
*.node[6].app[0].startTime = 0s
*.node[6].app[0].stopTime = 40s

# Trafic d'attaque : 10 paquets/seconde entre t=40 et t=80
*.node[6].app[1].typename = "UdpBasicApp"
*.node[6].app[1].destAddresses = "baseStation"
*.node[6].app[1].destPort = 5000
*.node[6].app[1].messageLength = 1024B          # Gros paquets malveillants
*.node[6].app[1].sendInterval = 0.1s            # 10 paquets/s
*.node[6].app[1].startTime = 40s
*.node[6].app[1].stopTime = 80s

# ============================================================
# [Config EnergyExhaustion] — Attaque par épuisement énergie
# Force les nœuds à rester éveillés via des requêtes répétées
# ============================================================
[Config EnergyExhaustion]
description = "Attaque energy exhaustion — requêtes répétées"

# Tous les nœuds reçoivent des requêtes supplémentaires
*.node[*].numApps = 2
*.node[*].app[1].typename = "UdpBasicApp"
*.node[*].app[1].destAddresses = "baseStation"
*.node[*].app[1].destPort = 5001
*.node[*].app[1].messageLength = 8B
*.node[*].app[1].sendInterval = 0.2s            # 5 requêtes/s → batterie
*.node[*].app[1].startTime = 30s
*.node[*].app[1].stopTime = 90s

*.baseStation.numApps = 2
*.baseStation.app[1].typename = "UdpSink"
*.baseStation.app[1].localPort = 5001

# ── Statistiques à collecter ──────────────────────────────
**.app[*].packetSent.vector-recording = true
**.app[*].packetReceived.vector-recording = true
**.app[*].endToEndDelay.vector-recording = true
**.energyStorage.residualEnergyCapacity.vector-recording = true
**.wlan[*].radio.*.vector-recording = true
