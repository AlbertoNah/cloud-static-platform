# ============================================================
# per_simulation.ini — Mesure du Packet Error Rate (PER)
# Rôle 4 : PER en fonction distance, temps, fading
# Projet : Modélisation cross-layer IoT — Semaine 2
#
# Dépend de : fading_channel.ini (Rôle 2)
# Prérequis : OMNeT++ 6.x + INET 4.x
# Lancer : opp_run -f per_simulation.ini -c PER_vs_Distance
# ============================================================

[General]
network = inet.TwoNodeNetwork
sim-time-limit = 120s
repeat = 10                         # 10 répétitions pour statistiques robustes
seed-set = ${repetition}

# ── Résultats ─────────────────────────────────────────────
result-dir = ../../results/omnet/per
output-scalar-file = ${resultdir}/per-${configname}-${runnumber}.sca
output-vector-file  = ${resultdir}/per-${configname}-${runnumber}.vec

**.scalar-recording = true
**.vector-recording = true

# ── Paramètres radio ──────────────────────────────────────
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz
**.wlan[*].radio.transmitter.power = 100mW         # 20 dBm
**.wlan[*].radio.receiver.sensitivity = -100dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# Fading Rayleigh (NLOS)
**.radioMedium.fadingType = "NakagamiFading"
**.radioMedium.fading.m = 1.0

# ── Propagation ───────────────────────────────────────────
**.radioMedium.pathLossType = "LogDistancePathLoss"
**.radioMedium.pathLoss.pathLossExponent = 3.0
**.radioMedium.pathLoss.referenceDistance = 1m

# ── Station de base (fixe) ────────────────────────────────
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 100m
*.baseStation.mobility.initialY = 100m

# ── Trafic : un paquet toutes les X secondes ──────────────
*.node1.numApps = 1
*.node1.app[0].typename = "UdpBasicApp"
*.node1.app[0].destAddresses = "baseStation"
*.node1.app[0].destPort = 5000
*.node1.app[0].messageLength = 32B                 # 256 bits
*.node1.app[0].sendInterval = 1s

*.baseStation.numApps = 1
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000

# ── Position nœud (fixe dans les configs non-sweep) ───────
*.node1.mobility.typename = "StationaryMobility"
*.node1.mobility.initialY = 100m
*.node1.mobility.initialZ = 1.5m

# ============================================================
# [Config PER_vs_Distance] — PER en fonction de la distance
# Sweep sur 6 distances : 10, 20, 40, 60, 80, 100m
# ============================================================
[Config PER_vs_Distance]
description = "PER mesuré pour différentes distances"

# Paramètre de sweep : distance (X du nœud = 100 + distance)
*.node1.mobility.initialX = ${dist = 110, 120, 140, 160, 180, 200}m

# Nom du run pour les résultats
**.result-recording-modes = all

# ============================================================
# [Config PER_vs_Time] — PER en fonction du temps (distance fixe)
# Nœud à 50m — observation de la variabilité temporelle
# ============================================================
[Config PER_vs_Time]
description = "PER mesuré dans le temps (distance fixe 50m)"

*.node1.mobility.initialX = 150m               # 50m de la base
sim-time-limit = 300s                          # 5 minutes pour voir l'évolution

# ============================================================
# [Config PER_vs_Fading] — Comparaison Rayleigh vs Rician vs NoFading
# ============================================================
[Config PER_Rayleigh]
description = "PER avec fading Rayleigh (NLOS)"
*.node1.mobility.initialX = 160m               # 60m
**.radioMedium.fading.m = 1.0

[Config PER_Rician]
description = "PER avec fading Rician (LOS partiel)"
*.node1.mobility.initialX = 160m
**.radioMedium.fading.m = 5.0                  # m=5 → Rician

[Config PER_NoFading]
description = "PER sans fading (référence)"
*.node1.mobility.initialX = 160m
# Pas de fading = déterministe

# ── Statistiques PER ──────────────────────────────────────
# Paquets envoyés par node1
*.node1.app[0].packetSent.vector-recording = true
*.node1.app[0].packetSent.scalar-recording = true

# Paquets reçus par la base
*.baseStation.app[0].packetReceived.vector-recording = true
*.baseStation.app[0].packetReceived.scalar-recording = true

# Signal au récepteur
*.baseStation.wlan[*].radio.minReceptionPower.vector-recording = true
*.baseStation.wlan[*].radio.snir.vector-recording = true

# Délai bout-en-bout
*.baseStation.app[0].endToEndDelay.vector-recording = true
