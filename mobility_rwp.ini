# ============================================================
# mobility_rwp.ini — Modèle de mobilité Random Waypoint
# Rôle 3 : Mobilité des nœuds IoT
# Projet : Modélisation cross-layer IoT — Semaine 2
#
# Prérequis : OMNeT++ 6.x + INET 4.x
# Lancer : opp_run -f mobility_rwp.ini -c RandomWaypoint
# ============================================================

[General]
network = inet.MobilityNetwork
sim-time-limit = 120s
repeat = 3
seed-set = ${repetition}

# ── Résultats ─────────────────────────────────────────────
result-dir = ../../results/omnet/mobility
output-scalar-file = ${resultdir}/mobility-${configname}-${repetition}.sca
output-vector-file  = ${resultdir}/mobility-${configname}-${repetition}.vec

**.scalar-recording = true
**.vector-recording = true

# ── Paramètres radio ──────────────────────────────────────
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -100dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# ── Modèle de propagation ─────────────────────────────────
**.radioMedium.pathLossType = "LogDistancePathLoss"
**.radioMedium.pathLoss.pathLossExponent = 3.0
**.radioMedium.pathLoss.referenceDistance = 1m

# Fading Rayleigh activé
**.radioMedium.fadingType = "NakagamiFading"
**.radioMedium.fading.m = 1.0

# ── Station de base (fixe — centre zone) ──────────────────
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 150m
*.baseStation.mobility.initialY = 150m
*.baseStation.mobility.initialZ = 3m

# Nœud fixe de référence
*.fixedNode.mobility.typename = "StationaryMobility"
*.fixedNode.mobility.initialX = 180m
*.fixedNode.mobility.initialY = 150m
*.fixedNode.mobility.initialZ = 1.5m

# ── Trafic ────────────────────────────────────────────────
# Nœud mobile → base
*.mobileNode.numApps = 1
*.mobileNode.app[0].typename = "UdpBasicApp"
*.mobileNode.app[0].destAddresses = "baseStation"
*.mobileNode.app[0].destPort = 5000
*.mobileNode.app[0].messageLength = 32B
*.mobileNode.app[0].sendInterval = 1s

# Nœud fixe → base
*.fixedNode.numApps = 1
*.fixedNode.app[0].typename = "UdpBasicApp"
*.fixedNode.app[0].destAddresses = "baseStation"
*.fixedNode.app[0].destPort = 5001
*.fixedNode.app[0].messageLength = 32B
*.fixedNode.app[0].sendInterval = 1s

*.baseStation.numApps = 2
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000
*.baseStation.app[1].typename = "UdpSink"
*.baseStation.app[1].localPort = 5001

# ============================================================
# [Config RandomWaypoint] — Mobilité RWP standard
# ============================================================
[Config RandomWaypoint]
description = "Random Waypoint Mobility — paramètres standards"

*.mobileNode.mobility.typename = "RandomWaypointMobility"

# Zone de déplacement : 300x300m
*.mobileNode.mobility.constraintAreaMinX = 0m
*.mobileNode.mobility.constraintAreaMaxX = 300m
*.mobileNode.mobility.constraintAreaMinY = 0m
*.mobileNode.mobility.constraintAreaMaxY = 300m
*.mobileNode.mobility.constraintAreaMinZ = 1.5m
*.mobileNode.mobility.constraintAreaMaxZ = 1.5m

# Vitesse : uniforme entre 1 et 10 m/s
*.mobileNode.mobility.speed = uniform(1mps, 10mps)

# Pause au waypoint : uniforme entre 0 et 5s
*.mobileNode.mobility.waitTime = uniform(0s, 5s)

# ============================================================
# [Config RWP_SlowNodes] — Nœuds lents (piétons IoT)
# ============================================================
[Config RWP_SlowNodes]
description = "Random Waypoint — nœuds lents (1-2 m/s)"
extends = RandomWaypoint

*.mobileNode.mobility.speed = uniform(0.5mps, 2mps)
*.mobileNode.mobility.waitTime = uniform(2s, 10s)    # Pauses plus longues

# ============================================================
# [Config RWP_FastNodes] — Nœuds rapides (véhicules IoT)
# ============================================================
[Config RWP_FastNodes]
description = "Random Waypoint — nœuds rapides (5-15 m/s)"
extends = RandomWaypoint

*.mobileNode.mobility.speed = uniform(5mps, 15mps)
*.mobileNode.mobility.waitTime = uniform(0s, 2s)

# ============================================================
# [Config RWP_SmallZone] — Zone restreinte (intérieur)
# ============================================================
[Config RWP_SmallZone]
description = "Random Waypoint — zone intérieure 50x50m"
extends = RandomWaypoint

*.mobileNode.mobility.constraintAreaMaxX = 50m
*.mobileNode.mobility.constraintAreaMaxY = 50m
*.mobileNode.mobility.speed = uniform(0.5mps, 3mps)

# ── Statistiques de mobilité ──────────────────────────────
# Position dans le temps
*.mobileNode.mobility.**.vector-recording = true
# Distance à la base (calculée via vecteurs)
**.wlan[*].radio.*.vector-recording = true
# Délai bout-en-bout
**.app[*].endToEndDelay.vector-recording = true
**.app[*].packetReceived.vector-recording = true
**.app[*].packetSent.vector-recording = true
