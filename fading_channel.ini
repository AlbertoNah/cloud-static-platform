# ============================================================
# fading_channel.ini — Modèle de canal radio avec fading
# Rôle 2 : Modélisation du canal (Rayleigh + log-distance)
# Projet : Modélisation cross-layer IoT — Semaine 2
#
# Prérequis : OMNeT++ 6.x + INET 4.x
# Lancer : opp_run -f fading_channel.ini -c FadingRayleigh
# ============================================================

[General]
ned-path = .;../inet4.5/src/inet
network = inet.TwoNodeNetwork
sim-time-limit = 120s
repeat = 5                          # 5 répétitions pour statistiques
seed-set = ${repetition}

# ── Enregistrement des résultats ──────────────────────────
result-dir = ../../results/omnet/fading
output-scalar-file = ${resultdir}/fading-${configname}-${repetition}.sca
output-vector-file = ${resultdir}/fading-${configname}-${repetition}.vec

# Activer les vecteurs de résultats importants
**.scalar-recording = true
**.vector-recording = true
**.radioMedium.*.vector-recording = true

# ── Paramètres radio généraux ─────────────────────────────
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz        # Fréquence Zigbee/Wi-Fi
**.wlan[*].radio.bandwidth = 2MHz
**.wlan[*].radio.transmitter.power = 100mW         # ~20 dBm

# Bruit thermique
**.wlan[*].radio.receiver.sensitivity = -100dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# ── Modèle de propagation ─────────────────────────────────
**.radioMedium.typename = "RadioMedium"
**.radioMedium.pathLossType = "LogDistancePathLoss"
**.radioMedium.pathLoss.pathLossExponent = 3.0     # Exposant urbain/intérieur
**.radioMedium.pathLoss.referenceDistance = 1m
**.radioMedium.pathLoss.referenceLoss = 40dB

# ── Modèle d'obstacle / shadowing ─────────────────────────
**.radioMedium.obstacleLossType = "IdealObstacleLoss"

# ── Positions des nœuds ───────────────────────────────────
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 100m
*.baseStation.mobility.initialY = 100m
*.baseStation.mobility.initialZ = 1.5m

*.node1.mobility.typename = "StationaryMobility"
*.node1.mobility.initialX = 120m             # 20m de la base
*.node1.mobility.initialY = 100m
*.node1.mobility.initialZ = 1.5m

# ── Trafic UDP simple ─────────────────────────────────────
*.node1.numApps = 1
*.node1.app[0].typename = "UdpBasicApp"
*.node1.app[0].destAddresses = "baseStation"
*.node1.app[0].destPort = 5000
*.node1.app[0].messageLength = 32B             # Paquet IoT typique (256 bits)
*.node1.app[0].sendInterval = 1s               # 1 paquet par seconde

*.baseStation.numApps = 1
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000

# ============================================================
# [Config FadingRayleigh] — Fading Rayleigh activé
# Scénario principal : canal instable NLOS
# ============================================================
[Config FadingRayleigh]
description = "Canal radio avec fading Rayleigh (NLOS)"

**.radioMedium.fadingType = "NakagamiFading"
**.radioMedium.fading.m = 1.0               # m=1 → Rayleigh pur

# Distance node1 ↔ base = 20m (proche, bon signal)
*.node1.mobility.initialX = 120m

# ============================================================
# [Config FadingRayleigh_Far] — Nœud éloigné (80m)
# Montre la dégradation combinée path loss + fading
# ============================================================
[Config FadingRayleigh_Far]
description = "Fading Rayleigh à grande distance (80m)"
extends = FadingRayleigh

*.node1.mobility.initialX = 180m            # 80m de la base

# ============================================================
# [Config FadingRician] — Fading Rician (canal LOS)
# Pour comparaison avec Rayleigh
# ============================================================
[Config FadingRician]
description = "Canal radio avec fading Rician (LOS)"

**.radioMedium.fadingType = "NakagamiFading"
**.radioMedium.fading.m = 5.0               # m>1 → Rician (LOS partiel)

*.node1.mobility.initialX = 120m

# ============================================================
# [Config NoFading] — Sans fading (référence)
# Permet de mesurer l'impact pur du path loss
# ============================================================
[Config NoFading]
description = "Canal log-distance sans fading (référence)"

# Pas de fading configuré = modèle déterministe pur
*.node1.mobility.initialX = 120m

# ── Statistiques à collecter ──────────────────────────────
# RSSI mesuré au récepteur
**.wlan[*].radio.minReceptionPower.vector-recording = true
# SNR
**.wlan[*].radio.snir.vector-recording = true
# Paquets reçus / envoyés
**.app[*].packetSent.vector-recording = true
**.app[*].packetReceived.vector-recording = true
