# ============================================================
# scenarios.ini — 3 scénarios complets de simulation
# Rôle 5 : Scénarios simples (dépend rôles 2, 3, 4)
# Projet : Modélisation cross-layer IoT — Semaine 2
#
# Prérequis : OMNeT++ 6.x + INET 4.x
# Lancer :
#   opp_run -f scenarios.ini -c Scenario1_TwoFixed
#   opp_run -f scenarios.ini -c Scenario2_FixedMobile
#   opp_run -f scenarios.ini -c Scenario3_SmallNetwork
# ============================================================

[General]
sim-time-limit = 120s
repeat = 5
seed-set = ${repetition}

result-dir = ../../results/omnet/scenarios
**.scalar-recording = true
**.vector-recording = true

# ── Paramètres radio communs à tous les scénarios ─────────
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -100dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

**.radioMedium.pathLossType = "LogDistancePathLoss"
**.radioMedium.pathLoss.pathLossExponent = 3.0
**.radioMedium.pathLoss.referenceDistance = 1m
**.radioMedium.fadingType = "NakagamiFading"
**.radioMedium.fading.m = 1.0

# ============================================================
# SCÉNARIO 1 — 2 nœuds fixes → impact distance
# Réseau : TwoNodeNetwork
# Objectif : montrer que RSSI et PER dépendent de la distance
# ============================================================
[Config Scenario1_TwoFixed]
description = "Scénario 1 — 2 nœuds fixes à différentes distances"
network = inet.TwoNodeNetwork

# Station de base au centre
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 100m
*.baseStation.mobility.initialY = 100m
*.baseStation.mobility.initialZ = 3m

# Nœud proche (20m)
*.node1.mobility.typename = "StationaryMobility"
*.node1.mobility.initialX = 120m
*.node1.mobility.initialY = 100m
*.node1.mobility.initialZ = 1.5m

# Trafic : 1 paquet/s pendant 120s
*.node1.numApps = 1
*.node1.app[0].typename = "UdpBasicApp"
*.node1.app[0].destAddresses = "baseStation"
*.node1.app[0].destPort = 5000
*.node1.app[0].messageLength = 32B
*.node1.app[0].sendInterval = 1s

*.baseStation.numApps = 1
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000

# Sweep distance : 20m, 40m, 60m, 80m
*.node1.mobility.initialX = ${xpos = 120, 140, 160, 180}m

# ============================================================
# SCÉNARIO 2 — 1 fixe + 1 mobile → impact mobilité
# Réseau : MobilityNetwork
# Objectif : comparer nœud fixe vs nœud mobile
# ============================================================
[Config Scenario2_FixedMobile]
description = "Scénario 2 — 1 nœud fixe + 1 nœud mobile (RWP)"
network = inet.MobilityNetwork

# Station de base
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 150m
*.baseStation.mobility.initialY = 150m
*.baseStation.mobility.initialZ = 3m

# Nœud fixe à 30m
*.fixedNode.mobility.typename = "StationaryMobility"
*.fixedNode.mobility.initialX = 180m
*.fixedNode.mobility.initialY = 150m
*.fixedNode.mobility.initialZ = 1.5m

# Nœud mobile — Random Waypoint
*.mobileNode.mobility.typename = "RandomWaypointMobility"
*.mobileNode.mobility.constraintAreaMinX = 0m
*.mobileNode.mobility.constraintAreaMaxX = 300m
*.mobileNode.mobility.constraintAreaMinY = 0m
*.mobileNode.mobility.constraintAreaMaxY = 300m
*.mobileNode.mobility.constraintAreaMinZ = 1.5m
*.mobileNode.mobility.constraintAreaMaxZ = 1.5m
*.mobileNode.mobility.speed = uniform(1mps, 10mps)
*.mobileNode.mobility.waitTime = uniform(0s, 5s)

# Trafic nœud fixe → base
*.fixedNode.numApps = 1
*.fixedNode.app[0].typename = "UdpBasicApp"
*.fixedNode.app[0].destAddresses = "baseStation"
*.fixedNode.app[0].destPort = 5000
*.fixedNode.app[0].messageLength = 32B
*.fixedNode.app[0].sendInterval = 1s

# Trafic nœud mobile → base
*.mobileNode.numApps = 1
*.mobileNode.app[0].typename = "UdpBasicApp"
*.mobileNode.app[0].destAddresses = "baseStation"
*.mobileNode.app[0].destPort = 5001
*.mobileNode.app[0].messageLength = 32B
*.mobileNode.app[0].sendInterval = 1s

*.baseStation.numApps = 2
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000
*.baseStation.app[1].typename = "UdpSink"
*.baseStation.app[1].localPort = 5001

# ============================================================
# SCÉNARIO 3 — Petit réseau IoT (5 à 10 nœuds)
# Réseau : SmallIoTNetwork
# Objectif : métriques globales sur un réseau complet
# ============================================================
[Config Scenario3_SmallNetwork]
description = "Scénario 3 — Petit réseau IoT (7 nœuds)"
network = inet.SmallIoTNetwork

# Station de base
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 200m
*.baseStation.mobility.initialY = 200m
*.baseStation.mobility.initialZ = 5m

# 7 nœuds placés à différentes distances de la base
# Distances : 10, 20, 35, 50, 65, 80, 95m
*.node[0].mobility.typename = "StationaryMobility"
*.node[0].mobility.initialX = 210m          # ~10m
*.node[0].mobility.initialY = 200m

*.node[1].mobility.typename = "StationaryMobility"
*.node[1].mobility.initialX = 220m          # ~20m
*.node[1].mobility.initialY = 200m

*.node[2].mobility.typename = "StationaryMobility"
*.node[2].mobility.initialX = 235m          # ~35m
*.node[2].mobility.initialY = 200m

*.node[3].mobility.typename = "StationaryMobility"
*.node[3].mobility.initialX = 250m          # ~50m
*.node[3].mobility.initialY = 200m

*.node[4].mobility.typename = "StationaryMobility"
*.node[4].mobility.initialX = 265m          # ~65m
*.node[4].mobility.initialY = 200m

*.node[5].mobility.typename = "StationaryMobility"
*.node[5].mobility.initialX = 280m          # ~80m
*.node[5].mobility.initialY = 200m

*.node[6].mobility.typename = "StationaryMobility"
*.node[6].mobility.initialX = 295m          # ~95m
*.node[6].mobility.initialY = 200m

# Trafic : chaque nœud envoie vers la base
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "baseStation"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 32B
*.node[*].app[0].sendInterval = uniform(0.8s, 1.2s)   # léger décalage aléatoire

*.baseStation.numApps = 1
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000

# ── Statistiques collectées (tous scénarios) ──────────────
**.app[*].packetSent.vector-recording = true
**.app[*].packetSent.scalar-recording = true
**.app[*].packetReceived.vector-recording = true
**.app[*].packetReceived.scalar-recording = true
**.app[*].endToEndDelay.vector-recording = true
**.app[*].endToEndDelay.scalar-recording = true
**.wlan[*].radio.minReceptionPower.vector-recording = true
*.mobileNode.mobility.**.vector-recording = true
