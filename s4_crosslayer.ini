# ============================================================
# s4_crosslayer.ini — Intégration cross-layer complète
# Semaine 4 : Scénarios réalistes urbains + attaques
# Projet : Modélisation cross-layer IoT
#
# Prérequis : OMNeT++ 6.x + INET 4.5
# Lancer :
#   opp_run -f s4_crosslayer.ini -c ScenarioA_Urban
#   opp_run -f s4_crosslayer.ini -c ScenarioB_Mobility
#   opp_run -f s4_crosslayer.ini -c ScenarioC_DDoS_Mobility
# ============================================================

[General]
sim-time-limit = 180s
repeat = 5
seed-set = ${repetition}

result-dir = ../../../results/omnet/s4
output-scalar-file = ${resultdir}/s4-${configname}-${repetition}.sca
output-vector-file  = ${resultdir}/s4-${configname}-${repetition}.vec

**.scalar-recording = true
**.vector-recording = true

# ── Radio ─────────────────────────────────────────────────
**.wlan[*].radio.typename = "Ieee80211ScalarRadio"
**.wlan[*].radio.carrierFrequency = 2.4GHz
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -100dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB

# ── Propagation + Fading Rayleigh ─────────────────────────
**.radioMedium.pathLossType = "LogDistancePathLoss"
**.radioMedium.pathLoss.pathLossExponent = 3.0
**.radioMedium.pathLoss.referenceDistance = 1m
**.radioMedium.fadingType = "NakagamiFading"
**.radioMedium.fading.m = 1.0

# ── Énergie ───────────────────────────────────────────────
**.energyStorage.typename = "SimpleEpEnergyStorage"
**.energyStorage.nominalCapacity = 1J
**.energyStorage.initialCapacity = 1J
**.wlan[*].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
**.wlan[*].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW
**.wlan[*].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
**.wlan[*].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
**.wlan[*].radio.energyConsumer.transmitterIdlePowerConsumption = 2mW

# ── Trafic de base ────────────────────────────────────────
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "baseStation"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 32B
*.node[*].app[0].sendInterval = uniform(0.8s, 1.2s)

*.baseStation.numApps = 1
*.baseStation.app[0].typename = "UdpSink"
*.baseStation.app[0].localPort = 5000

# ── Station de base ───────────────────────────────────────
*.baseStation.mobility.typename = "StationaryMobility"
*.baseStation.mobility.initialX = 200m
*.baseStation.mobility.initialY = 200m
*.baseStation.mobility.initialZ = 5m

# ── Positions initiales des 7 nœuds ──────────────────────
*.node[0].mobility.initialX = 210m
*.node[0].mobility.initialY = 200m
*.node[1].mobility.initialX = 220m
*.node[1].mobility.initialY = 200m
*.node[2].mobility.initialX = 235m
*.node[2].mobility.initialY = 200m
*.node[3].mobility.initialX = 250m
*.node[3].mobility.initialY = 200m
*.node[4].mobility.initialX = 265m
*.node[4].mobility.initialY = 200m
*.node[5].mobility.initialX = 280m
*.node[5].mobility.initialY = 200m
*.node[6].mobility.initialX = 295m
*.node[6].mobility.initialY = 200m

# ============================================================
# SCÉNARIO A — Urbain sans attaque (référence)
# ============================================================
[Config ScenarioA_Urban]
description = "Scénario A — Urbain référence, nœuds fixes"
network = iot_crosslayer.SmallIoTNetwork

*.node[*].numApps = 1
*.node[*].mobility.typename = "StationaryMobility"
*.node[*].mobility.initialZ = 1.5m

# ============================================================
# SCÉNARIO B — Urbain + mobilité (Random Waypoint)
# ============================================================
[Config ScenarioB_Mobility]
description = "Scénario B — Urbain + mobilité RWP"
network = iot_crosslayer.SmallIoTNetwork

*.node[*].numApps = 1
*.node[*].mobility.typename = "RandomWaypointMobility"
*.node[*].mobility.constraintAreaMinX = 100m
*.node[*].mobility.constraintAreaMaxX = 350m
*.node[*].mobility.constraintAreaMinY = 100m
*.node[*].mobility.constraintAreaMaxY = 350m
*.node[*].mobility.constraintAreaMinZ = 1.5m
*.node[*].mobility.constraintAreaMaxZ = 1.5m
*.node[*].mobility.speed = uniform(1mps, 8mps)
*.node[*].mobility.waitTime = uniform(0s, 5s)

# ============================================================
# SCÉNARIO C — DDoS + mobilité (pire cas)
# ============================================================
[Config ScenarioC_DDoS_Mobility]
description = "Scénario C — DDoS (t=60-120s) + mobilité RWP"
network = iot_crosslayer.SmallIoTNetwork

# Mobilité pour tous les nœuds
*.node[*].mobility.typename = "RandomWaypointMobility"
*.node[*].mobility.constraintAreaMinX = 100m
*.node[*].mobility.constraintAreaMaxX = 350m
*.node[*].mobility.constraintAreaMinY = 100m
*.node[*].mobility.constraintAreaMaxY = 350m
*.node[*].mobility.constraintAreaMinZ = 1.5m
*.node[*].mobility.constraintAreaMaxZ = 1.5m
*.node[*].mobility.speed = uniform(1mps, 8mps)
*.node[*].mobility.waitTime = uniform(0s, 3s)

# Trafic normal pour nœuds 0-5
*.node[0..5].numApps = 1

# Nœud 6 : attaquant DDoS entre t=60 et t=120
*.node[6].numApps = 2
*.node[6].app[0].typename = "UdpBasicApp"
*.node[6].app[0].destAddresses = "baseStation"
*.node[6].app[0].destPort = 5000
*.node[6].app[0].messageLength = 32B
*.node[6].app[0].sendInterval = 1s
*.node[6].app[0].stopTime = 60s

*.node[6].app[1].typename = "UdpBasicApp"
*.node[6].app[1].destAddresses = "baseStation"
*.node[6].app[1].destPort = 5000
*.node[6].app[1].messageLength = 1024B
*.node[6].app[1].sendInterval = 0.1s
*.node[6].app[1].startTime = 60s
*.node[6].app[1].stopTime = 120s

# ── Métriques à collecter (tous scénarios) ────────────────
**.app[*].packetSent.vector-recording = true
**.app[*].packetReceived.vector-recording = true
**.app[*].endToEndDelay.vector-recording = true
**.app[*].endToEndDelay.scalar-recording = true
**.energyStorage.residualEnergyCapacity.vector-recording = true
**.wlan[*].radio.minReceptionPower.vector-recording = true
*.node[*].mobility.**.vector-recording = true
